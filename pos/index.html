<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unruly Taste · POS (Demo)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="icon" href="../images/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link rel="stylesheet" href="pos.css">
</head>
<body>
<div class="demo-banner"><b>DEMO POS</b> · cash only · costs, recipes &amp; vendors are <b>examples</b> until Calton supplies real numbers</div>
<header class="top">
  <div class="brand"><img class="logo" src="../images/logo.webp" alt="Unruly Taste" width="62" height="48"><div><b>Point of Sale</b><span id="syncState" class="sync">connecting…</span></div></div>
  <button class="bell" id="bell" type="button" title="Low stock"><span>🔔</span><i id="bellCount" class="hidden">0</i></button>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="orders" class="on">🧾 <span>Orders</span><i id="openCount" class="cnt hidden"></i></button>
  <button data-tab="walkin">💵 <span>Walk-in</span></button>
  <button data-tab="stock">📦 <span>Stock</span><i id="lowCount" class="cnt warn hidden"></i></button>
  <button data-tab="today">📊 <span>Today</span></button>
  <button data-tab="settings">⚙️ <span>Settings</span></button>
</nav>
<main>
  <section id="tab-orders" class="tab"></section>
  <section id="tab-walkin" class="tab hidden"></section>
  <section id="tab-stock" class="tab hidden"></section>
  <section id="tab-today" class="tab hidden"></section>
  <section id="tab-settings" class="tab hidden"></section>
</main>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-panel" id="sheetPanel"></div></div>
<div id="login" class="login hidden">
  <form class="login-card" id="loginForm" autocomplete="off">
    <img class="logo big" src="../images/logo.webp" alt="Unruly Taste" width="124" height="96">
    <h1>Staff sign-in</h1>
    <p>Enter the staff PIN for this POS. It is saved on this device only.</p>
    <input id="pin" type="password" placeholder="Staff PIN" autocomplete="current-password" required>
    <button class="btn primary big" type="submit">Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="../config.js"></script>
<script src="../menu.js"></script>
<script src="pos.js"></script>
</body>
</html>
